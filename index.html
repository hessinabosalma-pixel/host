  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding: 20px 0;
    }
    .top-bar {
      position: absolute;
      top: 20px;
      right: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 42px;
      height: 42px;
      background: #1e88e5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(30, 136, 229, 0.5);
    }
    .logo-text { display: flex; flex-direction: column; line-height: 1.1; }
    .logo-title { font-size: 14px; font-weight: bold; letter-spacing: 1px; color: #bbdefb; }
    .logo-sub { font-size: 20px; font-weight: 900; letter-spacing: 2px; color: #ffffff; }
    .main-card {
      background: rgba(16, 23, 41, 0.85);
      border: 2px solid #1e293b;
      border-radius: 20px;
      padding: 25px 40px;
      width: 90%;
      max-width: 850px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 50px;
    }
    .main-title { font-size: 28px; font-weight: 800; color: #f1f5f9; margin-bottom: 15px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    .jersey-container {
      position: relative;
      width: 280px;
      max-width: 100%;
      margin: 5px 0;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
    }
    .jersey-overlay-text {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      text-align: center;
      color: #ffffff;
      font-size: 22px;
      font-weight: 900;
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0,0,0,0.8);
      line-height: 1.3;
      pointer-events: none;
    }
    .auto-btn {
      width: 100%;
      max-width: 650px;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      color: #ffffff;
      border: 2px solid #60a5fa;
      padding: 14px;
      font-size: 18px;
      font-weight: 900;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 15px;
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.6);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .auto-btn:hover {
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.9);
      transform: translateY(-2px);
    }
    .firmware-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 650px;
      margin: 10px 0;
    }
    .fw-btn {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #fbbf24;
      border: 1px solid #d97706;
      padding: 10px 8px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .fw-btn:hover {
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: #000000;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(245, 158, 11, 0.4);
    }
    .fw-btn:active { transform: scale(0.96); }
    .progress-section { width: 100%; max-width: 550px; margin-top: 15px; }
    .progress-bar-bg {
      width: 100%;
      height: 18px;
      background-color: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      position: relative;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 10px;
      transition: width 0.2s ease;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
    }
    .status-text { margin-top: 15px; font-size: 18px; font-weight: 700; color: #f8fafc; letter-spacing: 0.5px; }
  </style>

  <script>
    let isRunning = false;

    // تشغيل هتاف الجمهور مع توليد النغمة الصوتية للأهلي
    function playAhlyChantSound() {
      const audio = document.getElementById('ahlyAudio');
      if (audio) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }
      playAhlyChantWebAudio();
    }

    function playAhlyChantWebAudio() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        
        // نغمات لحن الأهلي "فريق كبير فريق عظيم"
        const notes = [
          { f: 392.00, d: 0.3, t: 0.0 },  // Sol
          { f: 440.00, d: 0.3, t: 0.35 }, // La
          { f: 392.00, d: 0.3, t: 0.7 },  // Sol
          { f: 349.23, d: 0.4, t: 1.05 }, // Fa
          { f: 392.00, d: 0.5, t: 1.5 },  // Sol
          { f: 440.00, d: 0.3, t: 2.1 },  // La
          { f: 493.88, d: 0.4, t: 2.45 }, // Si
          { f: 523.25, d: 0.6, t: 2.9 }   // Do
        ];

        notes.forEach(note => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(note.f, ctx.currentTime + note.t);
          
          gain.gain.setValueAtTime(0, ctx.currentTime + note.t);
          gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + note.t + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + note.t + note.d);
          
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          osc.start(ctx.currentTime + note.t);
          osc.stop(ctx.currentTime + note.t + note.d);
        });
      } catch (e) {
        console.log(e);
      }
    }

    function detectFirmware() {
      const ua = navigator.userAgent;
      let fw = "11.00";
      const match = ua.match(/PlayStation 4 ([0-9\.]+)/);
      if (match && match[1]) {
        fw = match[1];
      } else {
        fw = "13.60";
      }
      return fw;
    }

    function autoDetectJailbreak() {
      playAhlyChantSound();
      const detectedFw = detectFirmware();
      triggerJailbreak(detectedFw + " (تلقائي)");
    }

    function triggerJailbreak(fwVersion) {
      if (isRunning) return;
      isRunning = true;
      playAhlyChantSound();

      const fill = document.getElementById('progressFill');
      const status = document.getElementById('statusText');
      fill.style.width = '0%';
      status.innerText = 'جاري تفعيل كسر الحماية لـ FW ' + fwVersion + '...';

      let currentWidth = 0;
      const interval = setInterval(() => {
        if (currentWidth >= 100) {
          clearInterval(interval);
          status.innerText = '🔥 GoldHEN v2.4 Loaded Successfully! (FW ' + fwVersion + ')';
          isRunning = false;
        } else {
          currentWidth += 10;
          fill.style.width = currentWidth + '%';
        }
      }, 150);
    }
  </script>
